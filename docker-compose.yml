services:
  app:
    build: .
    container_name: agenda-reuniao-app
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agenda}:${POSTGRES_PASSWORD:-agenda}@postgres:5432/${POSTGRES_DB:-agenda}
      TZ: America/Sao_Paulo
      # A imagem roda com NODE_ENV=production, então o portão de senha vale aqui
      # também. Sem ACCESS_PASSWORD no `.env` a aplicação sobe, mas fica fechada.
      ACCESS_PASSWORD: ${ACCESS_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: agenda-reuniao-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agenda}
      POSTGRES_DB: ${POSTGRES_DB:-agenda}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agenda} -d ${POSTGRES_DB:-agenda}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data: