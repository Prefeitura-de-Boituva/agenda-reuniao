# Ambiente de produ��ǜo: aplica��ǜo + Caddy (TLS) + Neon (sem Postgres local).
#
# Uso:
#   docker compose -f docker-compose.prod.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# A `DATABASE_URL` deve ser a connection string **pooled** do Neon
# (host terminando em `-pooler`). Ela pode vir do ambiente do host ou do `.env`
# (que o docker compose carrega automaticamente). Veja `.env.production.example`.
#
# O Caddy publica 80/443 com TLS automǭtico (Let's Encrypt) e encaminha para
# `app:3000` pela rede interna. O app nǜo Ǹ exposto diretamente �� internet.
#
# As migrations NǟO rodam no container (a imagem standalone nǜo inclui a CLI do
# Prisma). Aplique-as antes do deploy, a partir do reposit��rio:
#   npx prisma db migrate --db "<DIRECT_URL de produ��ǜo>"
#   npx prisma db verify  --db "<DIRECT_URL de produ��ǜo>" --strict

services:
  app:
    build: .
    # Tag por commit permite rollback: TAG=<sha> docker compose ... up -d --build
    image: agenda-reuniao:${TAG:-latest}
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      TZ: America/Sao_Paulo
      DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL (connection string pooled do Neon)}
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    healthcheck:
      # Node 24 tem `fetch` global: evita depender do wget do BusyBox.
      # Nǜo usa `?db=1` de prop��sito (nǜo deve acordar o Neon a cada 30s).
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Defina DOMAIN (dominio fixo)}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
